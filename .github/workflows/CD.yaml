name: CD

# main deploys to api (production), develop deploys to beta.
# The shared workflow is FINTLabs/fint-core-workflows branch-deploy.yaml.
# The image is tagged sha-<last commit that changed the app>.
on:
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  cd:
    uses: FINTLabs/fint-core-workflows/.github/workflows/branch-deploy.yaml@v1
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      namespace: fintlabs-no
